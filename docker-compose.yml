services:
  db:
    image: postgres:16-alpine
    container_name: sih_document_screening_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-screening}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-screening}
      POSTGRES_DB: ${POSTGRES_DB:-screening}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-screening} -d ${POSTGRES_DB:-screening}"]
      interval: 5s
      timeout: 5s
      retries: 10

  screening-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sih_document_screening_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
      - API_ENV=production
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-screening}:${POSTGRES_PASSWORD:-screening}@db:5432/${POSTGRES_DB:-screening}
      - DB_CONNECT_RETRIES=10
      - DB_RETRY_DELAY=2
      - FACE_MODELS_DIR=/opt/insightface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  postgres-data: